# Issue #46 — the gate CLAUDE.md mandates pre-commit, lifted into Actions.
# Four parallel jobs (fmt / clippy / doc / test). Toolchain version is read
# from `rust-toolchain.toml` (1.93.0) by `actions-rust-lang/setup-rust-toolchain`.
#
# Issue #47 — two further jobs run the `#[ignore]`-gated conformance suites
# against real backends (Postgres, MySQL, Garage, fake-gcs-server).
# They sit alongside the core four; failures don't cascade. `tests/upstream_diff.rs` is deliberately
# NOT wired here — it requires the upstream Node server running with
# SKIP_TOKEN_VALIDATION=true, which is out of scope for self-contained CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Force-pushing a fixup cancels the previous run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default minimum; this workflow doesn't comment, label, or push.
permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `setup-rust-toolchain` reads `rust-toolchain.toml` natively — single
      # source of truth for the pinned 1.93.0 toolchain + rustfmt + clippy.
      # `rustflags: ""` overrides the action's `-D warnings` default; we set
      # it explicitly per job (clippy/doc) so the gate is never silent.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # Caches `target/` + cargo registry, keyed on Cargo.lock + toolchain.
      # `shared-key` collapses the action's default per-job-name slot so
      # all five compiling jobs reuse the same dep-build artifacts —
      # critical for the integration jobs, which were cold-building from
      # scratch (~170s) with default keying. Subsequent runs log
      # "Cache restored from key…" (AC #3 from #46).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      - run: cargo clippy --all-targets --locked -- -D warnings

  doc:
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    env:
      # `RUSTDOCFLAGS` is the right knob for rustdoc lints; `RUSTFLAGS`
      # would cause an unrelated full rebuild.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      - run: cargo doc --no-deps --locked

  test:
    name: cargo test --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      # `--all-targets` covers benches/examples but skips doctests;
      # `--doc` picks them up. Cheap today (zero runnable doctests),
      # future-proof when one lands.
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  # ---- Integration suites against real backends (issue #47) ------------
  #
  # Per-test-binary scoping is load-bearing: `cargo test -- --ignored`
  # without `--test <name>` would also fire the *other* suite's tests,
  # which `expect()` their own env vars and would panic. See
  # `tests/db_conformance.rs:96` and `tests/storage_conformance.rs:77`.

  integration-postgres:
    name: cargo test --ignored (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Major-pinned; alpine variant keeps image small. Dependabot's
        # `docker` ecosystem (issue #49) tracks this naturally.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      # Positional `postgres` filter scopes the shared db_conformance
      # binary to postgres-named tests (postgres::*,
      # runner_executes_full_suite_against_postgres). Without the
      # filter, this job would also fire the mysql ignored tests
      # against `DATABASE_URL`, which would parse as a postgres URL and
      # fail at the first MySQL-specific query. Same scoping pattern as
      # the integration-s3 / integration-gcs jobs.
      - name: Postgres conformance
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked --test db_conformance -- --ignored postgres

  integration-mysql:
    name: cargo test --ignored (mysql)
    runs-on: ubuntu-latest
    services:
      mysql:
        # Major-pinned 8.x; `oracle` variant is the official upstream
        # image. Dependabot's `docker` ecosystem (issue #49) tracks this.
        image: mysql:8-oracle
        env:
          MYSQL_ROOT_PASSWORD: mysql
          # The bootstrap database `mysql_setup` connects to before
          # creating its per-test database.
          MYSQL_DATABASE: gha_cache_bootstrap
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      # Positional `mysql` filter — symmetric with the postgres job.
      - name: MySQL conformance
        env:
          DATABASE_URL: mysql://root:mysql@127.0.0.1:3306/gha_cache_bootstrap
        run: cargo test --locked --test db_conformance -- --ignored mysql

  integration-s3:
    name: cargo test --ignored (s3 / garage)
    runs-on: ubuntu-latest
    # Garage (https://garagehq.deuxfleurs.fr) replaced MinIO here: the
    # pinned minio/minio image stopped being pullable from Docker Hub
    # (Sept 2026), and Garage is the S3 backend oxide is deployed on.
    # **Bump policy:** Garage uses semver tags (`vX.Y.Z`); bump manually
    # after reading the release notes (Dependabot does not scan
    # workflow `env:` image refs, see .github/dependabot.yml).
    env:
      GARAGE_IMAGE: docker.io/dxflrs/garage:v2.1.0
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build

      # Starts the container, waits for it, creates the bucket the tests
      # expect (`S3_TEST_BUCKET`, default `gha-cache-test`; tests don't
      # create it) and a key, and exports the key via $GITHUB_ENV.
      # Garage's own logs go to stderr, so only KEY=VALUE lines reach
      # the env file.
      - name: Start Garage
        run: .github/scripts/start-garage.sh >> "$GITHUB_ENV"

      # The positional `s3` filter scopes the `storage_conformance`
      # binary to s3-named tests (s3::*, runner_..._against_s3,
      # s3_missing_bucket_produces_clear_error) so the gcs scenarios in
      # the same binary don't fire here without `GCS_TEST_ENDPOINT` set.
      # Same pattern in the integration-gcs job.
      - name: S3 conformance + adapter
        env:
          S3_TEST_ENDPOINT: http://localhost:3900
        run: cargo test --locked --test s3_adapter --test storage_conformance -- --ignored s3

      - name: Garage logs on failure
        if: failure()
        run: docker logs garage

  integration-gcs:
    name: cargo test --ignored (gcs / fake-gcs-server)
    runs-on: ubuntu-latest
    # `tustvold/fake-gcs-server` is the fork `object_store`'s own
    # integration tests use — the upstream `fsouza/fake-gcs-server`
    # doesn't implement the XML-API write path that `object_store::gcp`
    # emits at `{base_url}/{bucket}/{object}`, so PUTs land on the JSON
    # API handler and fail with `invalid uploadType`. Digest-pinned for
    # reproducibility (only `latest` tag exists, last pushed 2023-10-27).
    env:
      FAKE_GCS_IMAGE: tustvold/fake-gcs-server@sha256:dcd3aeacc07c731f1336e90c2889be2af8626ae993ee1fe2c0ba042ebbeb5a04
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build

      # `object_store`'s GCS client emits XML-API requests at
      # `{base_url}/{bucket}/{object}`. fake-gcs-server's XML-API write
      # path rejects OAuth-signed requests with a misleading
      # `invalid uploadType` 400. The fix used by `object_store`'s own
      # integration tests is the special service-account JSON form
      # below: `gcs_base_url` + `disable_oauth: true` tells the client
      # to skip OAuth and emit anonymous requests against the emulator
      # base URL. Trade-off: signed-URL tests can't run because the
      # signer needs a real private key — those scenarios are excluded
      # from the GCS conformance run (see `tests/storage_conformance.rs`).
      - name: Write emulator service account
        run: |
          cat > /tmp/sa.json <<'EOF'
          {
            "gcs_base_url": "http://localhost:4443",
            "disable_oauth": true,
            "client_email": "",
            "private_key": "",
            "private_key_id": ""
          }
          EOF

      # Sidecar via `docker run` for the same custom-healthcheck reason
      # as the Garage (S3) job. `-backend memory` keeps the emulator state in
      # RAM — same shape `object_store`'s own tests use. `-public-host`
      # makes fake-gcs-server emit URLs the test runner can reach.
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs \
            -p 4443:4443 \
            --health-cmd "wget -qO- http://localhost:4443/storage/v1/b 2>/dev/null || exit 1" \
            --health-interval 3s \
            --health-timeout 3s \
            --health-retries 20 \
            "$FAKE_GCS_IMAGE" -scheme http -public-host localhost:4443 -backend memory

      - name: Wait for fake-gcs-server healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fake-gcs 2>/dev/null || echo unknown)
            case "$status" in
              healthy) echo "fake-gcs healthy"; exit 0 ;;
              unhealthy) docker logs fake-gcs; exit 1 ;;
            esac
            sleep 2
          done
          echo "fake-gcs failed to become healthy in 60s"
          docker logs fake-gcs
          exit 1

      # `tests/storage_conformance.rs::gcs_setup` reads `GCS_TEST_BUCKET`
      # (default `gha-cache-test`) and expects it to exist; tests don't
      # create it.
      - name: Create test bucket
        run: |
          curl -fsS -X POST 'http://localhost:4443/storage/v1/b' \
            -H 'Content-Type: application/json' \
            -d '{"name":"gha-cache-test"}'

      - name: GCS conformance + adapter
        env:
          GCS_TEST_ENDPOINT: http://localhost:4443
          GCS_TEST_BUCKET: gha-cache-test
          GCS_TEST_SA_KEY: /tmp/sa.json
        # `gcs` positional filter scopes the shared
        # `storage_conformance` binary to gcs-named tests; same pattern
        # the integration-s3 job uses for s3.
        run: cargo test --locked --test gcs_adapter --test storage_conformance -- --ignored gcs
