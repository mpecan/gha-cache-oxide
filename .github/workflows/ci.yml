# Issue #46 — the gate CLAUDE.md mandates pre-commit, lifted into Actions.
# Four parallel jobs (fmt / clippy / doc / test). Toolchain version is read
# from `rust-toolchain.toml` (1.93.0) by `actions-rust-lang/setup-rust-toolchain`.
#
# Issue #47 — two further jobs run the `#[ignore]`-gated conformance suites
# against real backends (Postgres, MinIO). They sit alongside the core
# four; failures don't cascade. `tests/upstream_diff.rs` is deliberately
# NOT wired here — it requires the upstream Node server running with
# SKIP_TOKEN_VALIDATION=true, which is out of scope for self-contained CI.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Force-pushing a fixup cancels the previous run on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default minimum; this workflow doesn't comment, label, or push.
permissions:
  contents: read

jobs:
  fmt:
    name: cargo fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # `setup-rust-toolchain` reads `rust-toolchain.toml` natively — single
      # source of truth for the pinned 1.93.0 toolchain + rustfmt + clippy.
      # `rustflags: ""` overrides the action's `-D warnings` default; we set
      # it explicitly per job (clippy/doc) so the gate is never silent.
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      # Caches `target/` + cargo registry, keyed on Cargo.lock + toolchain.
      # `shared-key` collapses the action's default per-job-name slot so
      # all five compiling jobs reuse the same dep-build artifacts —
      # critical for the integration jobs, which were cold-building from
      # scratch (~170s) with default keying. Subsequent runs log
      # "Cache restored from key…" (AC #3 from #46).
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      - run: cargo clippy --all-targets --locked -- -D warnings

  doc:
    name: cargo doc -D warnings
    runs-on: ubuntu-latest
    env:
      # `RUSTDOCFLAGS` is the right knob for rustdoc lints; `RUSTFLAGS`
      # would cause an unrelated full rebuild.
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      - run: cargo doc --no-deps --locked

  test:
    name: cargo test --locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      # `--all-targets` covers benches/examples but skips doctests;
      # `--doc` picks them up. Cheap today (zero runnable doctests),
      # future-proof when one lands.
      - run: cargo test --locked --all-targets
      - run: cargo test --locked --doc

  # ---- Integration suites against real backends (issue #47) ------------
  #
  # Per-test-binary scoping is load-bearing: `cargo test -- --ignored`
  # without `--test <name>` would also fire the *other* suite's tests,
  # which `expect()` their own env vars and would panic. See
  # `tests/db_conformance.rs:96` and `tests/storage_conformance.rs:77`.

  integration-postgres:
    name: cargo test --ignored (postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        # Major-pinned; alpine variant keeps image small. Dependabot's
        # `docker` ecosystem (issue #49) tracks this naturally.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build
      - name: Postgres conformance
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: cargo test --locked --test db_conformance -- --ignored

  integration-s3:
    name: cargo test --ignored (s3 / minio)
    runs-on: ubuntu-latest
    # MinIO uses RELEASE.YYYY-MM-DDTHH-MM-SSZ tags exclusively (no major
    # channel), so Dependabot can't track this scheme. **Bump policy:**
    # manual review against MinIO release notes for breaking changes.
    env:
      MINIO_IMAGE: minio/minio:RELEASE.2025-09-07T16-13-09Z
      MC_IMAGE: minio/mc:RELEASE.2025-08-13T08-35-41Z
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build

      # Sidecar via `docker run` (not `services:`) so we can attach a
      # custom healthcheck. `services:` accepts `options:` but escaping
      # MinIO's curl-based check inside a single line gets ugly fast.
      - name: Start MinIO
        run: |
          docker run -d --name minio \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            --health-cmd "curl -fsS http://localhost:9000/minio/health/live || exit 1" \
            --health-interval 3s \
            --health-timeout 3s \
            --health-retries 20 \
            "$MINIO_IMAGE" server /data

      - name: Wait for MinIO healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' minio 2>/dev/null || echo unknown)
            case "$status" in
              healthy) echo "minio healthy"; exit 0 ;;
              unhealthy) docker logs minio; exit 1 ;;
            esac
            sleep 2
          done
          echo "minio failed to become healthy in 60s"
          docker logs minio
          exit 1

      # `tests/storage_conformance.rs:99` reads `S3_TEST_BUCKET`
      # (default `gha-cache-test`) and expects it to exist; tests don't
      # create it. `mb -p` is idempotent.
      - name: Create test bucket
        run: |
          docker run --rm --network host \
            -e MC_HOST_local=http://minioadmin:minioadmin@localhost:9000 \
            "$MC_IMAGE" mb -p local/gha-cache-test

      # The positional `s3` filter scopes the `storage_conformance`
      # binary to s3-named tests (s3::*, runner_..._against_s3,
      # s3_missing_bucket_produces_clear_error) so the gcs scenarios in
      # the same binary don't fire here without `GCS_TEST_ENDPOINT` set.
      # Same pattern in the integration-gcs job.
      - name: S3 conformance + adapter
        env:
          S3_TEST_ENDPOINT: http://localhost:9000
          S3_TEST_ACCESS_KEY: minioadmin
          S3_TEST_SECRET_KEY: minioadmin
        run: cargo test --locked --test s3_adapter --test storage_conformance -- --ignored s3

  integration-gcs:
    name: cargo test --ignored (gcs / fake-gcs-server)
    runs-on: ubuntu-latest
    # fake-gcs-server publishes immutable major-tagged images; bump
    # manually after release-notes review (same policy as MinIO).
    env:
      FAKE_GCS_IMAGE: fsouza/fake-gcs-server:1.52
    steps:
      - uses: actions/checkout@v6
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rustflags: ""
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-build

      # `object_store`'s GCS signer needs a parseable RSA key even when
      # the target endpoint (fake-gcs-server) doesn't validate
      # signatures. Generate one at job start and embed it in a minimal
      # service-account JSON. The key is per-run, never persisted.
      - name: Generate fake service account
        run: |
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
            -out /tmp/sa-private.pem -quiet
          jq -n --rawfile pk /tmp/sa-private.pem '{
            type: "service_account",
            project_id: "fake-project",
            private_key_id: "fake",
            private_key: $pk,
            client_email: "fake@fake-project.iam.gserviceaccount.com",
            client_id: "0",
            auth_uri: "https://accounts.google.com/o/oauth2/auth",
            token_uri: "https://oauth2.googleapis.com/token",
            auth_provider_x509_cert_url: "https://www.googleapis.com/oauth2/v1/certs",
            client_x509_cert_url: "https://www.googleapis.com/robot/v1/metadata/x509/fake@fake-project.iam.gserviceaccount.com"
          }' > /tmp/sa.json

      # Sidecar via `docker run` for the same custom-healthcheck reason
      # as the MinIO job. `-public-host` makes fake-gcs-server emit
      # signed-URL hostnames the test runner can reach.
      - name: Start fake-gcs-server
        run: |
          docker run -d --name fake-gcs \
            -p 4443:4443 \
            --health-cmd "wget -qO- http://localhost:4443/storage/v1/b 2>/dev/null || exit 1" \
            --health-interval 3s \
            --health-timeout 3s \
            --health-retries 20 \
            "$FAKE_GCS_IMAGE" -scheme http -port 4443 -public-host localhost:4443

      - name: Wait for fake-gcs-server healthy
        run: |
          for _ in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' fake-gcs 2>/dev/null || echo unknown)
            case "$status" in
              healthy) echo "fake-gcs healthy"; exit 0 ;;
              unhealthy) docker logs fake-gcs; exit 1 ;;
            esac
            sleep 2
          done
          echo "fake-gcs failed to become healthy in 60s"
          docker logs fake-gcs
          exit 1

      # `tests/storage_conformance.rs::gcs_setup` reads `GCS_TEST_BUCKET`
      # (default `gha-cache-test`) and expects it to exist; tests don't
      # create it.
      - name: Create test bucket
        run: |
          curl -fsS -X POST 'http://localhost:4443/storage/v1/b' \
            -H 'Content-Type: application/json' \
            -d '{"name":"gha-cache-test"}'

      - name: GCS conformance + adapter
        env:
          GCS_TEST_ENDPOINT: http://localhost:4443
          GCS_TEST_BUCKET: gha-cache-test
          GCS_TEST_SA_KEY: /tmp/sa.json
        # `gcs` positional filter scopes the shared
        # `storage_conformance` binary to gcs-named tests; same pattern
        # the integration-s3 job uses for s3.
        run: cargo test --locked --test gcs_adapter --test storage_conformance -- --ignored gcs
