# Issue #49 — keep dependency drift mechanical instead of manual.
#
# Three ecosystems run weekly. Each opens a single grouped PR for
# minor + patch updates; majors land as individual PRs so they get
# review (per AC #4 — no `major` in any group's `update-types`).
#
# Schema: https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2

updates:
  # Rust dependencies. Cargo.lock is checked in, so resolution is
  # deterministic and grouped PRs are diff-stable across runs.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # CI workflow action pins. Dependabot scans `.github/workflows/*.yml`
  # for `uses:` references — `actions/checkout@v4`,
  # `Swatinem/rust-cache@v2`, `actions-rust-lang/setup-rust-toolchain@v1`,
  # `docker/*@v3..v6`, etc. (issues #46, #47, #48).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ci)
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # Dockerfile base images, pinned as literal `tag@digest`:
  # `rust:1.93.0-alpine3.20@sha256:…` and the distroless runtime
  # (`gcr.io/distroless/static-debian13:nonroot@sha256:…`). Dependabot
  # bumps the digest (and tag) of each `FROM` line.
  #
  # NOT covered by this ecosystem:
  # - Images referenced from `ci.yml` (`services:` blocks such as
  #   `postgres:16-alpine`, and `env:` refs such as `GARAGE_IMAGE`) —
  #   Dependabot's docker scanner only reads Dockerfiles and
  #   docker-compose, not workflows. Bump policy: manual review against
  #   release notes (documented inline at each image in
  #   `.github/workflows/ci.yml`).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(ops)
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch
