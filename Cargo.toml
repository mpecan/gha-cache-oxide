[workspace]
members = ["crates/orpc-server"]

[package]
name = "gha-cache-oxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/mpecan/gha-cache-oxide"
description = "A Rust port of falcondev-oss/github-actions-cache-server — a self-hostable, drop-in replacement for GitHub's Actions cache."
readme = "README.md"

[[bin]]
name = "gha-cache-oxide"
path = "src/main.rs"

[lib]
name = "gha_cache_oxide"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
base64 = "0.23"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.17"
futures = "0.3"
hex = "0.4"
hmac = "0.13"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
object_store = { version = "0.13", features = ["aws", "gcp"] }
rand = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "postgres", "mysql", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"
orpc-server = { path = "crates/orpc-server" }
utoipa = { version = "5", features = ["axum_extras", "url"] }
utoipa-axum = "0.2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }
proptest = "1"
rsa = "0.9"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

# Benchmark harness — see benches/protocol.rs and README §"Benchmarks"
# (issue #21). `harness = false` lets criterion provide its own main.
[[bench]]
name = "protocol"
harness = false

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

# Release profile is tuned for the distroless image size budget
# (issue #20: ≤ 20 MB). LTO + strip + single codegen unit roughly
# halves the binary vs. cargo defaults. `panic = "abort"` is
# deliberately not set: the size win is small once `lto` is on, and
# keeping unwinding leaves the door open for `#[should_panic]` tests
# and the standard backtrace-on-panic operator UX.
[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
