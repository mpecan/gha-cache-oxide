[package]
name = "gha-cache-oxide"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/mpecan/gha-cache-oxide"
description = "A Rust port of falcondev-oss/github-actions-cache-server — a self-hostable, drop-in replacement for GitHub's Actions cache."
readme = "README.md"

[[bin]]
name = "gha-cache-oxide"
path = "src/main.rs"

[lib]
name = "gha_cache_oxide"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
